<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Éval JV">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<title>KEYENCE · Joint Visit</title>
<style>
:root{
--red:#E60012; --red-d:#b3000e; --red-soft:#fdecee;
--ink:#16181d; --mut:#6b7280; --line:#e3e5ea; --bg:#f3f4f7; --card:#fff;
--tb:#1e8e3e; --b:#7cb342; --m:#f29900; --mv:#d93025;
--rad:14px; --sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:inherit}

/* ---- lock */
#lock{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#2a2a2a,#000);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lock .box{background:#fff;border-radius:16px;padding:36px 34px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lock .logo{background:#000;display:inline-block;padding:12px 20px;border-radius:8px;border-bottom:3px solid var(--red)}
#lock .logo img{height:22px;display:block}
#lock h1{font-size:22px;margin:20px 0 6px}
#lock p{color:var(--mut);font-size:14px;margin:0 0 18px}
#lock input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;outline:none}
#lock input:focus{border-color:var(--red)}
#lock button{margin-top:12px;width:100%;padding:13px;background:var(--red);color:#fff;border-radius:10px;font-weight:700;font-size:16px}
#lock .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
#lock .conf{font-size:11.5px;color:var(--mut);margin-top:8px}

/* ---- top bar */
.topbar{position:sticky;top:0;z-index:50;background:#000;color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tb-row{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));border-bottom:3px solid var(--red)}
.kl img{height:18px;display:block}
.app-title{font-weight:700;font-size:16px;line-height:1.15}
.app-title small{display:block;font-weight:400;font-size:11.5px;color:#aaa}
.save-ind{margin-left:auto;font-size:12px;color:#9ca3af;white-space:nowrap}
.save-ind.ok{color:#86efac}.save-ind.warn{color:#fbbf24}
.ctx-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#121316}
.ctx-seller{display:flex;align-items:center;gap:10px;background:#23252b;border-radius:40px;padding:4px 14px 4px 4px;min-height:48px;color:#fff;font-weight:600}
.ctx-seller .av{width:40px;height:40px}
.ctx-seller small{display:block;font-weight:400;color:#9ca3af;font-size:11.5px}
.ctx-field{display:flex;flex-direction:column;gap:2px}
.ctx-field label{font-size:10.5px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em}
.ctx-field input{background:#23252b;border:1px solid #33363d;border-radius:10px;color:#fff;padding:8px 10px;min-height:40px;color-scheme:dark}
.ctx-field input[list]{width:210px}
.ctx-sp{flex:1}
.ctx-btn{background:#23252b;border:1px solid #33363d;border-radius:10px;color:#fff;padding:9px 14px;min-height:44px;font-weight:600;font-size:14px}
.ctx-btn:active{background:#33363d}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;color:var(--ink)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 14px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;min-height:48px;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--mut)}
.tab.add{color:var(--red)}
.tab .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---- layout */
main{max-width:1100px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .num{background:#000;color:#fff;font-size:12px;border-radius:6px;padding:3px 8px}
.card h2 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
@media (max-width:620px){.grid3{grid-template-columns:1fr}}
.hint{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- form */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label{font-size:12px;font-weight:600;color:var(--mut)}
.f input,.f textarea,.f select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%;min-height:44px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--red)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit{position:relative}.unit input{padding-right:42px}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;color:#374151}
.chip.on{background:#000;border-color:#000;color:#fff}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:9px;font-weight:600;min-height:44px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ---- rating grid */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-head h2{margin:0;flex:1}
.score-badge{font-weight:800;font-size:15px;padding:5px 12px;border-radius:20px;color:#fff;white-space:nowrap}
.score-badge.na{background:var(--bg);color:var(--mut);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.crit{border-top:1px solid var(--line);padding:10px 0}
.crit-main{display:flex;align-items:center;gap:12px}
.crit-t{flex:1;font-weight:500;min-width:0}
.rates{display:flex;gap:6px;flex-shrink:0}
.rate{min-width:86px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:#4b5563;padding:0 8px}
.rate[data-v="4"].on{background:var(--tb);border-color:var(--tb);color:#fff}
.rate[data-v="3"].on{background:var(--b);border-color:var(--b);color:#fff}
.rate[data-v="2"].on{background:var(--m);border-color:var(--m);color:#fff}
.rate[data-v="1"].on{background:var(--mv);border-color:var(--mv);color:#fff}
.note-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);font-size:18px;position:relative;flex-shrink:0;background:#fff}
.note-btn.has{border-color:#000}
.note-btn.has::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.crit textarea{margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:56px;resize:vertical;outline:none}
.crit textarea:focus{border-color:var(--red)}
@media (max-width:900px){
  .crit-main{flex-wrap:wrap}
  .crit-t{flex-basis:100%}
  .rates{flex:1}
  .rate{flex:1;min-width:0}
}

/* ---- visits list */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:110px}
.vcard:active{background:var(--bg)}
.vcard .vt{font-weight:700;font-size:15px}
.vcard .vs{font-size:12.5px;color:var(--mut)}
.vcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--red);font-weight:700;font-size:15px}
.type-tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:#374151}
.type-tag.demo{background:#e0ecff;color:#1d4ed8}.type-tag.appli{background:#fdecee;color:var(--red-d)}.type-tag.fu{background:#e7f6ec;color:#15803d}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--bg);border-radius:12px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mut)}

/* ---- notebook */
.nb-meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px}
details.nb{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
details.nb>summary{list-style:none;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
details.nb>summary::-webkit-details-marker{display:none}
details.nb>summary::before{content:"›";font-size:20px;transition:transform .15s;color:var(--mut);width:12px}
details.nb[open]>summary::before{transform:rotate(90deg)}
details.nb>summary .cnt{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--mut)}
details.nb>summary .cnt.full{background:#e7f6ec;color:#15803d}
details.nb .nb-body{padding:4px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.nb-body .wide{grid-column:1/-1}
.bant{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:2px 6px}

/* ---- recap */
.meter{width:100%;border-collapse:collapse}
.meter th{font-size:12px;color:var(--mut);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.meter td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.meter td.n{font-weight:800;font-size:16px;white-space:nowrap;width:80px}
.meter .bar{height:10px}
.lvl{display:inline-block;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.meter textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;min-height:36px;height:36px;resize:vertical;outline:none;font-size:14px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero .av{width:76px;height:76px;font-size:24px}
.hero h1{margin:0;font-size:22px}
.hero .sub{color:var(--mut);font-size:13.5px}
.gauge{margin-left:auto;text-align:center}
.gauge b{font-size:38px;display:block;line-height:1}
.gauge span{font-size:12px;color:var(--mut)}
.radar-wrap{display:flex;justify-content:center}
.radar-wrap svg{max-width:420px;width:100%;height:auto}
.list-sw{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:9px;background:var(--bg)}
.sw .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.sw .sm{color:var(--mut);font-size:12px}
.sw button{margin-left:auto;font-size:12px;font-weight:700;color:var(--red);white-space:nowrap;padding:2px 4px}
.todo{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.todo b{color:var(--red)}
.todo input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
.todo input:focus{border-color:var(--red)}
table.vt{width:100%;border-collapse:collapse;font-size:14px}
table.vt th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:6px;border-bottom:1px solid var(--line)}
table.vt th:first-child,table.vt td:first-child{text-align:left}
table.vt td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.cell{display:inline-block;min-width:44px;padding:3px 6px;border-radius:7px;font-weight:700;font-size:13px}
.tscroll{overflow-x:auto}

/* ---- buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:700;min-height:46px;background:#000;color:#fff;font-size:14.5px}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--mv);border:1.5px solid #f3c1bd}
.btn:active{opacity:.85}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---- history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.hrow .av{width:42px;height:42px}
.hrow .hm{flex:1;min-width:0}
.hrow .hm b{display:block}
.hrow .hm span{font-size:12.5px;color:var(--mut)}
.hrow .gs{font-weight:800;font-size:18px;text-align:right}
.hrow.cur{border-color:#000}

/* ---- avatars / modal / toast */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#3a3d44;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto}
.modal-box{background:#fff;border-radius:16px;width:min(760px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-box h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center}
.modal-box h3 button{margin-left:auto;font-size:26px;width:44px;height:44px;color:var(--mut)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:65vh;overflow:auto}
.pick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1.5px solid var(--line);text-align:left;font-size:13.5px;font-weight:600;min-height:58px}
.pick>span{min-width:0;overflow-wrap:anywhere}
.pick small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.pick.on{border-color:var(--red);background:var(--red-soft)}
.pick-office{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#111;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:300;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---- print (fiche vendeur A4) */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  #root>*:not(#printArea),#lock,#modal,#toast{display:none!important}
  #printArea{display:block}
  #root.hidden{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pf{font-size:11.5px;color:#111}
.pf-head{display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:10px 14px;border-bottom:3px solid var(--red)}
.pf-head img.l{height:15px}
.pf-head .t{font-weight:800;font-size:15px}
.pf-head .t small{display:block;font-weight:400;color:#bbb;font-size:10.5px}
.pf-head .g{margin-left:auto;text-align:right}
.pf-head .g b{font-size:24px;display:block;line-height:1}
.pf-id{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #ddd}
.pf-id .av{width:54px;height:54px}
.pf h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px;border-left:3px solid var(--red);padding-left:7px}
.pf table{width:100%;border-collapse:collapse}
.pf td,.pf th{border-bottom:1px solid #e5e5e5;padding:4px 6px;text-align:left;vertical-align:top}
.pf th{font-size:10px;color:#666}
.pf .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pf .lvl{font-size:10px;padding:2px 8px}
.pf .foot{margin-top:14px;font-size:9.5px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:6px}
.pf ul{margin:0;padding-left:16px}
.pf li{margin-bottom:2px}

/* =================== v2 : design plus visuel =================== */
body{background:linear-gradient(180deg,#eef0f4 0,#f5f6f8 400px)}
.card{border:1px solid #eceef2;border-radius:18px}
/* sections */
.sec-top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.sec-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#1f2229,#000);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.sec-ic.red{background:linear-gradient(135deg,#ff2a3d,#b3000e);font-size:15px}
.sec-ti{flex:1;min-width:0}
.sec-ti h2{margin:0;font-size:18px}
.sec-sub{font-size:12.5px;color:var(--mut);margin-top:1px}
.sec-prog{height:5px;border-radius:4px;background:#eef0f3;margin-top:7px;overflow:hidden;max-width:320px}
.sec-prog i{display:block;height:100%;background:linear-gradient(90deg,#E60012,#ff6b6b);border-radius:4px;transition:width .3s}
.donut{flex-shrink:0}
.legend{background:#fff;border:1px solid #eceef2;border-radius:12px;padding:8px 12px;margin:0 0 14px;align-items:center}
.legend .lg-h{margin-left:auto}
/* critères */
.crit{border-top:1px solid #f0f1f4;padding:10px 0 10px 12px;position:relative}
.crit::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:#eceef2}
.crit.rated::before{background:var(--lc)}
.rates{display:flex;gap:0;background:#f3f4f7;border-radius:12px;padding:3px;flex-shrink:0}
.rate{min-width:92px;min-height:44px;border:0;border-radius:9px;background:transparent;color:#4b5563;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s,transform .1s}
.rate i{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0}
.rate:active{transform:scale(.96)}
.rate.on,.rate[data-v].on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.rate.on i{background:#fff}
.note-btn{display:flex;align-items:center;justify-content:center;color:#9ca3af;border-radius:12px;border:1.5px solid #eceef2}
.note-btn.has{color:#000;border-color:#000}
@media (max-width:900px){.rates{flex:1}.rate{flex:1;min-width:0;padding:0 4px}}
@media (max-width:560px){.rate i{display:none}.rate{font-size:12px}}
/* héros visite */
.vhero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:radial-gradient(circle at 85% 20%,#3a0a10 0,#111 55%);color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-bottom:4px solid var(--red)}
.vh-l{flex:1;min-width:220px}
.vh-k{font-size:12px;color:#aab;letter-spacing:.04em;text-transform:uppercase}
.vh-c{font-size:24px;font-weight:800;margin:2px 0 8px}

/* parcours IV4 / SJ */

/* v9 : indicateurs de performance (récap) */
.kpig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpic{border:2px solid #e3e5ea;border-radius:14px;padding:12px 14px;background:#fff}
.kpic.main{border-color:#f5b5bb;background:linear-gradient(135deg,#fff5f6,#fff)}
.kpic-v{font-size:28px;font-weight:800;line-height:1.05;color:#16181d}
.kpic.main .kpic-v{color:var(--red)}
.kpic-v small{font-size:15px;margin-left:2px}
.kpic-l{font-size:12.5px;font-weight:700;color:#374151;margin-top:4px}
.kpic-bar{height:6px;border-radius:4px;background:#eef0f3;margin-top:8px;overflow:hidden}
.kpic-bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.kpic-s{font-size:11.5px;color:var(--mut);margin-top:4px}
@media (max-width:700px){.kpig{grid-template-columns:1fr 1fr}.kpic{padding:10px}.kpic-v{font-size:22px}}

/* v10 : N/A + commentaires sur la stratégie */
.qrow .na-btn,.qrow .note-btn{flex-shrink:0}
.qrow.na .q-t{color:#9ca3af;text-decoration:line-through}
.qrow.na .q-ic{filter:grayscale(1);opacity:.5}
.choice.na-box{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px dashed #c9ced6;border-radius:11px;background:#f7f8fa;color:#6b7280;font-size:12.5px;font-weight:700;text-align:center;padding:0 10px}
textarea.sc-note{width:100%;border:2px solid #c9ced6;border-radius:10px;padding:9px 12px;min-height:56px;resize:vertical;outline:none;margin:-2px 0 4px}
textarea.sc-note:focus{border-color:var(--red)}

/* v11 : lignes Stratégie / Outputs alignées sur la grille (même colonne de choix, N/A et bulle au même endroit) */
.qlist{gap:0;margin-top:2px}
.qrow{border:0;border-top:1px solid #f0f1f4;border-radius:0;background:none;padding:10px 0 10px 12px;gap:12px;position:relative}
.qrow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:#eceef2}
.qrow.done,.qrow.yes{background:none;border-color:#f0f1f4}
.qrow.done::before{background:#111}
.qrow.yes::before{background:var(--red)}
.qrow.na::before{background:repeating-linear-gradient(45deg,#d1d5db 0 3px,#f3f4f7 3px 6px)}
.q-ic{width:36px;height:36px;font-size:18px;border-radius:10px}
.qrow .choice.big,.qrow .choice.na-box{flex:0 0 auto;width:calc(4 * 92px + 3 * 6px);min-width:0}
.q-sp{width:104px;flex-shrink:0}
@media (max-width:900px){
  .qrow{flex-wrap:wrap}
  .qrow .q-t{flex:1 1 calc(100% - 60px)}
  .qrow .choice.big,.qrow .choice.na-box{flex:1 1 0;width:auto;flex-basis:0}
  .q-sp{width:104px}
}
@media (max-width:760px){.qrow .choice{flex-basis:0}}
@media (max-width:600px){.q-sp{display:none}.qrow{gap:6px;padding:8px 0 8px 10px}}

.kpig{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.kpig{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.vh-out{grid-template-columns:repeat(4,1fr)}}

/* v12 : une seule largeur pour toutes les colonnes de choix (grille, stratégie, outputs, photos, N/A) */
:root{--rw:404px}
@media (min-width:901px){
  .crit .rates,.ph-rates,.rates.na-box,.qrow .choice.big,.qrow .choice.na-box{width:var(--rw);flex:0 0 var(--rw);min-width:0}
  .crit .rates .rate{flex:1;min-width:0}
}
.ph-crit .note-sp{width:104px}

.kpic-bar.bal{display:flex;background:#eef0f3}
.kpic-bar.bal i{background:var(--red);border-radius:4px 0 0 4px}
.kpic-bar.bal b{display:block;height:100%;background:#111;border-radius:0 4px 4px 0}

/* v13 : indicateurs colorés selon barème / objectif */
.kpic.st{border-color:color-mix(in srgb,var(--sc) 45%,#fff);background:color-mix(in srgb,var(--sc) 7%,#fff)}
.kpic.st .kpic-v{color:var(--sc)}
.kpic.st .kpic-bar i{background:var(--sc)}
.kpic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.kpic-tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--sc);border-radius:10px;padding:3px 8px;white-space:nowrap;margin-top:3px}
.kpic-bar{position:relative;overflow:visible}
.kpic-bar i{position:relative;z-index:1}
.kpic-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#16181d;border-radius:2px;z-index:2;text-decoration:none}
/* balance IV / SJ : IV orange, SJ bleu ciel */
.kpic-bar.bal i{background:#f29900!important}
.kpic-bar.bal b{background:#38bdf8!important}

/* onglet Read me */
.help p{margin:0 0 8px;line-height:1.55}
.help ol.hl-steps,.help ul{margin:6px 0 0;padding-left:22px;line-height:1.6}
.help li{margin-bottom:4px}
table.hl-t{width:100%;border-collapse:collapse;font-size:14px}
table.hl-t th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:6px 8px;border-bottom:2px solid #e3e5ea}
table.hl-t td{padding:8px;border-bottom:1px solid #eef0f3;vertical-align:top}
.hp{font-weight:800;padding:1px 7px;border-radius:8px;color:#fff}.hp.g{background:#1e8e3e}.hp.o{background:#f29900}.hp.r{background:#d93025}

</style>
</head>

// ---------------------------------------------------------------- calculs
function vals(scores, sec) { return sec.items.map(([id]) => scores[id]).filter(v => v > 0); }

// indicateurs de performance qualitatifs (taux rapportés au nombre de visites)
function dayKpis(d) {

  const rate = (num, den) => ({ num, den, val: den ? num / den : null });
  const contacts = d.visits.reduce((a, v) => a + (+v.contacts || 0), 0);
  const asked = d.visits.filter(v => v.sc.contact).length;
  return [
    { ic: '🎯', label: t('kpiApp'), bands: 1, ...rate(o.app, n) },
    { ic: '🏭', label: t('kpiTarget'), goal: .7, ...rate(d.visits.filter(v => /^TARGET/.test(v.info.target || '')).length, n) },
    { ic: '👥', label: t('kpiContacts'), goal: 1.4, ratio: 1, num: contacts, den: n, val: n ? contacts / n : null },
    { ic: '👤', label: t('kpiDecider'), goal: .8, ...rate(d.visits.filter(v => v.sc.contact === 'YES').length, asked) },
    { ic: '🎬', label: t('kpiPromo'), ...rate(d.visits.filter(v => v.info.purpose === 'DEMO' || v.info.purpose === 'APPLICATION').length, n) },
    (() => { const vs = d.visits.filter(v => !(v.scNa || {}).ngf), y = vs.filter(v => v.sc.ngf === 'YES').length, p = vs.filter(v => v.sc.ngf === 'PARTIAL').length;
      return { ic: '✨', label: t('kpiNgf'), num: y, den: vs.length, val: vs.length ? (y + p / 2) / vs.length : null, sub: `${y} ${opt('YES')} · ${p} ${opt('PARTIAL')} / ${vs.length}` }; })(),
    (() => { const iv = d.visits.filter(v => v.info.product === 'IV').length, sj = d.visits.filter(v => v.info.product === 'SJ').length;
      return { ic: '⚖️', label: t('kpiBal'), bal: { iv, sj }, num: iv, den: sj, val: iv + sj ? iv / (iv + sj) : null, sub: iv + sj ? `IV ${Math.round(iv / (iv + sj) * 100)} % · SJ ${Math.round(sj / (iv + sj) * 100)} %` : '–' }; })(),
  ];
}
function kpiStatus(k) {
  if (k.val == null) return null;
  if (k.bands) { const v = k.val + 1e-9; const lv = v < 2 / 6 ? 3 : v < 3 / 6 ? 2 : v < 4 / 6 ? 1 : 0; return { c: LEVELS[lv].c, t: lv === 0 ? t('excellent') : L(LEVELS[lv].t), s: lv === 0 ? t('excellent') : L(LEVELS[lv].t) }; }
  if (k.goal != null) { const q = k.val / k.goal + 1e-9; return q >= 1 ? { c: '#1e8e3e', t: t('goalOk'), s: t('goalOkS') } : q >= .8 ? { c: '#f29900', t: t('goalNear'), s: t('goalNearS') } : { c: '#d93025', t: t('goalKo'), s: t('goalKoS') }; }

}

function critStats(day) {

  Object.entries(day.scores).forEach(([id, v]) => add(id, v)); day.visits.forEach(x => Object.entries(x.scores).forEach(([id, v]) => add(id, v)));

    const k = await deriveKey(pw, b64d(p.salt), p.iter);
    DATA = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.iv) }, k, b64d(p.data))));
  } catch (e) { err.textContent = window.crypto && crypto.subtle ? '✗ Mot de passe incorrect · Wrong password · パスワードが違います' : 'Safari / Edge'; $('#go').disabled = false; return; }
  KEY = await deriveKey(pw, new TextEncoder().encode('keyence-jv-eval-store-v1'), 250000);

  const st = await kvGet('state');

function radar(vs, labels, size = 420) {
  const cx = size / 2, cy = size / 2 + 4, R = size / 2 - 70, n = vs.length;
  const pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / n), cy - r * Math.cos(2 * Math.PI * i / n)];
  let s = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  [5, 10, 15, 20].forEach(k => { s += `<polygon points="${labels.map((_, i) => pt(i, R * k / 20).join(',')).join(' ')}" fill="${k === 20 ? '#fafafa' : 'none'}" stroke="#e3e5ea"/><text x="${cx + 3}" y="${cy - R * k / 20 + 11}" font-size="10" fill="#9ca3af">${k}</text>`; });
  labels.forEach((l, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3e5ea"/>`; const [tx, ty] = pt(i, R + 30); const lv = level(vs[i]);
    s += `<text x="${tx}" y="${ty}" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">${esc(l)}</text><text x="${tx}" y="${ty + 15}" text-anchor="middle" font-size="12" font-weight="700" fill="${lv ? lv.c : '#9ca3af'}">${vs[i] == null ? '–' : f1(vs[i])}</text>`; });
  s += `<polygon points="${vs.map((v, i) => pt(i, R * (v || 0) / 20).join(',')).join(' ')}" fill="rgba(230,0,18,.18)" stroke="#E60012" stroke-width="2.5"/>`;
  vs.forEach((v, i) => { if (v != null) { const [x, y] = pt(i, R * v / 20); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#E60012"/>`; } });
  return s + '</svg>';
}
function distBar(list, opts) { // barre empilée par option
  const tot = list.length; if (!tot) return '<span class="hint">–</span>';
  return `<div class="stack">${opts.map(([code, , col]) => { const n = list.filter(x => x === code).length; return n ? `<i style="flex:${n};background:${col}" title="${esc(opt(code))} : ${n}">${n}</i>` : ''; }).join('')}${list.filter(x => !x).length ? `<i style="flex:${list.filter(x => !x).length};background:#e5e7eb;color:#6b7280">${list.filter(x => !x).length}</i>` : ''}</div>`;
}

// ---- page Historique
function lineChart(days) {
  const W = 760, H = 240, Lm = 34, Rr = 14, Tm = 14, B = 34; const n = days.length;
  const x = i => n === 1 ? (Lm + W - Rr) / 2 : Lm + i * (W - Lm - Rr) / (n - 1); const y = v => Tm + (20 - v) * (H - Tm - B) / 20;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  [[0, 7.5, '#d93025'], [7.5, 12.5, '#f29900'], [12.5, 17.5, '#7cb342'], [17.5, 20, '#1e8e3e']].forEach(([a, b, c]) => s += `<rect x="${Lm}" y="${y(b)}" width="${W - Lm - Rr}" height="${y(a) - y(b)}" fill="${c}" opacity=".07"/>`);
  [0, 5, 10, 15, 20].forEach(v => s += `<line x1="${Lm}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e5ea"/><text x="${Lm - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#9ca3af">${v}</text>`);
  const pts = days.map((d, i) => [x(i), dayGlobal(d)]).filter(p => p[1] != null);
  if (pts.length > 1) s += `<polyline points="${pts.map(p => p[0] + ',' + y(p[1])).join(' ')}" fill="none" stroke="#E60012" stroke-width="2.5"/>`;
  days.forEach((d, i) => { const g = dayGlobal(d); s += `<text x="${x(i)}" y="${H - 12}" font-size="11" text-anchor="middle" fill="#6b7280">${fmtDate(d.date).slice(0, 5)}</text>`;
    if (g != null) s += `<circle cx="${x(i)}" cy="${y(g)}" r="5" fill="${level(g).c}" stroke="#fff" stroke-width="2"/><text x="${x(i)}" y="${y(g) - 10}" font-size="11.5" font-weight="700" text-anchor="middle">${f1(g)}</text>`; });
  return s + '</svg>';
}

    body: 'Bonjour {first},\n\nMerci pour la journée de Joint Visit du {date} que nous avons passée ensemble sur le terrain ({n} visite(s)).\n\nTu trouveras en pièce jointe le détail de ton évaluation : Sales Skill Meter ({g}/20 – {lvl}), stratégie commerciale et outputs obtenus.{todo}\n\nN\'hésite pas à revenir vers moi si tu as des questions.\n\nBonne continuation,\n{ev}' },
  en: { subj: 'Joint visit {date} – your evaluation', todo: '\n\nAreas to work on next time:\n',
    body: 'Hello {first},\n\nThank you for the joint visit day on {date} that we spent together in the field ({n} visit(s)).\n\nPlease find attached the details of your evaluation: Sales Skill Meter ({g}/20 – {lvl}), sales strategy and outputs obtained.{todo}\n\nFeel free to come back to me if you have any questions.\n\nBest regards,\n{ev}' },
  ja: { subj: '同行訪問（{date}）評価', todo: '\n\n次回への改善点：\n',
    body: '{first}さん\n\n{date}の同行訪問、一日ありがとうございました（訪問{n}件）。\n\n評価の詳細を添付します：セールススキルメーター（{g}/20・{lvl}）、営業戦略、獲得アウトプット。{todo}\n\n不明な点があれば気軽に聞いてください。\n\n引き続きよろしくお願いします。\n{ev}' },
};
function guessEmail(n) { const p = String(n || '').trim().split(/\s+/); const last = p.slice(1).join('') || p[0] || ''; return slug(last).replace(/-/g, '') + '@keyence.fr'; }
let MAIL = null;
function openMailModal() {
  const d = curDay(); if (!d) return;
  let blob; try { blob = buildPdf(d); } catch (e) { console.error(e); toast('PDF ✗ ' + e.message); return; }
  const name = pdfName(d); const g = dayGlobal(d), gl = level(g), M0 = MAILTXT[LANG];
  const todo = d.todo.filter(x => x.trim());
  const fill = s => s.split('{first}').join(d.seller.split(/\s+/)[0]).split('{date}').join(fmtDate(d.date)).split('{n}').join(d.visits.length)
    .split('{g}').join(f1(g)).split('{lvl}').join(gl ? L(gl.t) : '–').split('{ev}').join(d.evaluator || S.evaluator)
    .split('{todo}').join(todo.length ? M0.todo + todo.map(x => '- ' + x).join('\n') : '');
  if (MAIL && MAIL.url) URL.revokeObjectURL(MAIL.url);
  MAIL = { blob, name, url: URL.createObjectURL(blob), file: new File([blob], name, { type: 'application/pdf' }) };
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [MAIL.file] }));
  const to = (S.emails || {})[d.seller] || guessEmail(d.seller);
  openModal('<h3>' + t('mailTitle') + '<button data-act="closeModal">×</button></h3>' +
    '<div class="f"><label>' + t('mailTo') + '</label><input id="mailTo" type="email" value="' + esc(to) + '"></div>' +
    '<div class="f" style="margin-top:10px"><label>' + t('mailSubj') + '</label><input id="mailSubj" value="' + esc(fill(M0.subj)) + '"></div>' +
    '<div class="f" style="margin-top:10px"><label>' + t('mailBody') + '</label><textarea id="mailBody" style="min-height:220px">' + esc(fill(M0.body)) + '</textarea></div>' +
    '<div class="att"><span>📎</span><b>' + esc(name) + '</b><small>' + Math.round(blob.size / 1024) + ' Ko</small><button class="btn ghost sm" data-act="mailPreview">' + t('preview') + '</button></div>' +
    '<p class="hint">' + ((isIOS() && canShare) ? t('mailHintIOS') : t('mailHintPC')) + '</p>' +
    '<div class="actions">' + (canShare && isIOS() ? '<button class="btn red" data-act="mailShare">' + t('sendShare') + '</button>' : '') +
    '<button class="btn ' + (canShare && isIOS() ? '' : 'red') + '" data-act="mailDl">' + t('dlMail') + '</button>' +
    (canShare && !isIOS() ? '<button class="btn ghost" data-act="mailShare">' + t('sendShare') + '</button>' : '') + '</div>');
}
function mailFields() {
  const d = curDay(); const to = $('#mailTo').value.trim();
  S.emails = S.emails || {}; if (to) { S.emails[d.seller] = to; saveSoon(); }
  return { to, subj: $('#mailSubj').value, body: $('#mailBody').value };
}
function mailShare() {
  const m = mailFields();
  if (m.to && navigator.clipboard) navigator.clipboard.writeText(m.to).then(() => toast(t('addrCopied'))).catch(() => {});
  navigator.share({ files: [MAIL.file], title: m.subj, text: m.body }).catch(e => { if (e.name !== 'AbortError') toast(e.message); });
}
function mailDownloadOpen() {
  const m = mailFields();
  const a = document.createElement('a'); a.href = MAIL.url; a.download = MAIL.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { location.href = 'mailto:' + encodeURIComponent(m.to).replace(/%40/g, '@') + '?subject=' + encodeURIComponent(m.subj) + '&body=' + encodeURIComponent(m.body); }, 600);
}

// ---------------------------------------------------------------- modales
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function openSellerPicker(q = '') {
  const nq = q.toLowerCase();
  const list = people().filter(p => !nq || p.name.toLowerCase().includes(nq) || (p.office || '').toLowerCase().includes(nq));
  const offices = [...new Set(list.map(p => p.office || '—'))];
  openModal(`<h3>${t('chooseSeller')}<button data-act="closeModal">×</button></h3>
    <div class="row" style="margin-bottom:12px"><div class="f" style="flex:1"><input id="pickQ" placeholder="${t('search')}" value="${esc(q)}"></div><button class="btn ghost" data-act="addPerson">${t('newSeller')}</button></div>
    <div class="pick-grid">${offices.map(o => `<div class="pick-office">${esc(o)}</div>` + list.filter(p => (p.office || '—') === o).map(p =>
      `<button class="pick ${p.name === S.seller ? 'on' : ''}" data-act="setSeller" data-n="${esc(p.name)}">${avatar(p.name)}<span>${esc(p.name)}<small>${esc(p.role || '')}</small></span></button>`).join('')).join('')}</div>`);
  const qi = $('#pickQ'); qi.addEventListener('input', () => { const pos = qi.selectionStart; openSellerPicker(qi.value); const nn = $('#pickQ'); nn.focus(); nn.setSelectionRange(pos, pos); });
}

// ---------------------------------------------------------------- photos
let photoTarget = null;
// deux entrées : photothèque / fichiers (multiple) et appareil photo direct (capture)
const photoInput = document.createElement('input'); photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.multiple = true; photoInput.className = 'hidden'; document.body.appendChild(photoInput);
const camInput = document.createElement('input'); camInput.type = 'file'; camInput.accept = 'image/*'; camInput.setAttribute('capture', 'environment'); camInput.className = 'hidden'; document.body.appendChild(camInput);
camInput.addEventListener('change', () => onPhotos(camInput));
photoInput.addEventListener('change', () => onPhotos(photoInput));
async function onPhotos(inp) {
  const files = [...inp.files]; inp.value = ''; if (!files.length || !photoTarget) return;
  const d = curDay(); const v = photoHolder(d, photoTarget.i); if (!v) return;
  for (const f of files) { try { (v.photos[photoTarget.key] = v.photos[photoTarget.key] || []).push(await compress(f)); } catch (e) { toast('✗ ' + t('image')); } }
  touch(d); renderPage(); toast(`📸 ${files.length} ${t('photosN')}`);
}
// appareil photo : uniquement sur tablette (iPad) ; sur PC le bouton est grisé
const hasCam = () => isIOS() || (/Android/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function camBtn(i, key) {
  return hasCam() ? `<button class="rate ph-sm" data-act="addPhoto" data-src="cam" data-i="${i}" data-key="${key}">📷 ${t('camShort')} <em class="ipad-tag">iPad</em></button>`
    : `<button class="rate ph-sm off" disabled title="${t('ipadOnly')}">📷 ${t('camShort')} <em class="ipad-tag">iPad</em></button>`;
}
// i = -1 : photos de la journée (véhicule) ; sinon photos de la visite i
function photoHolder(d, i) { if (i < 0) { d.photos = d.photos || {}; return d; } return d.visits[i]; }
function photoPanel(i, key, arr, title) {
  return `<div class="crit ph-crit"><div class="crit-main"><div class="crit-t">📸 ${esc(title)} <span class="hint">· ${arr.length} ${t('photosN')}</span></div>
    <div class="rates ph-rates">${camBtn(i, key)}<button class="rate ph-sm" data-act="addPhoto" data-src="lib" data-i="${i}" data-key="${key}">🖼️ ${t('libShort')}</button></div>
    <span class="note-sp"></span></div>
    ${arr.length ? `<div class="ph-grid">${arr.map((src, jj) => `<span class="ph-th"><img src="${src}" data-act="zoom"><button data-act="delPhoto" data-i="${i}" data-key="${key}" data-j="${jj}">✕</button></span>`).join('')}</div>` : ''}</div>`;
}
function compress(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

// ---------------------------------------------------------------- liaison des champs
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; } o[ks[ks.length - 1]] = val; }
function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], obj); }
document.addEventListener('input', e => {
  const x = e.target;
  if (x.id === 'ctxEval') return;
  const b = x.dataset && x.dataset.bind; if (!b) return; const d = curDay(); if (!d) return;
  setPath(d, b, x.value); touch(d);
});
document.addEventListener('change', e => {
  const x = e.target;
  if (x.id === 'ctxDate') { if (x.value) { S.date = x.value; DRAFT = null; UI.tab = 'day'; saveSoon(); render(); } return; }
  if (x.id === 'ctxEval') {
    let v = x.value;
    if (v === '__other') { v = (prompt(t('otherEvalQ')) || '').trim(); if (!v) { renderCtx(); return; } S.extraEvaluators = [...new Set([...(S.extraEvaluators || []), v])]; }
    S.evaluator = v; const d = curDay(); if (d) { d.evaluator = v; if (S.days[d.id]) touch(d); else saveSoon(); } else saveSoon(); renderCtx(); return;
  }
  if (x.id === 'histSel') { UI.histSeller = x.value; renderPage(); return; }
  if (x.id === 'fileImport') { const f = x.files[0]; x.value = ''; if (f) importFile(f); }
});
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) UI.open[k] = e.target.open; }, true);
function gotoId(id) { const e = document.getElementById(id); if (!e) return; const sn = $('.subnav'); const off = $('.topbar').offsetHeight + (sn ? sn.offsetHeight : 0) + 8; window.scrollTo({ top: e.getBoundingClientRect().top + window.scrollY - off, behavior: 'auto' }); }

// ---------------------------------------------------------------- actions
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; const d = curDay();
  switch (a) {
    case 'lang': LANG = el.dataset.l; localStorage.setItem('jv_lang', LANG); setInd('', ''); render(); break;
    case 'tab': UI.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'openVisit': UI.tab = 'visit'; UI.vi = +el.dataset.i; render(); window.scrollTo(0, 0); break;
    case 'addVisit': d.visits.push(blankVisit()); touch(d); UI.tab = 'visit'; UI.vi = d.visits.length - 1; render(); window.scrollTo(0, 0); break;
    case 'delVisit': if (confirm(t('confirmDelVisit', { n: (+el.dataset.i + 1) + (d.visits[el.dataset.i].company ? ' (' + d.visits[el.dataset.i].company + ')' : '') }))) { d.visits.splice(+el.dataset.i, 1); touch(d); UI.tab = 'day'; render(); } break;
    case 'rate': { const holder = el.dataset.base ? getPath(d, el.dataset.base.slice(0, -1)) : d; const id = el.dataset.id; const v = +el.dataset.v;
      if (holder.scores[id] === v) delete holder.scores[id]; else holder.scores[id] = v; touch(d); renderPage(); renderTabs(); break; }
    case 'na': { const holder = el.dataset.base ? getPath(d, el.dataset.base.slice(0, -1)) : d; const id = el.dataset.id; holder.na = holder.na || {};
      if (holder.na[id]) delete holder.na[id]; else { holder.na[id] = true; delete holder.scores[id]; } touch(d); renderPage(); renderTabs(); break; }
    case 'scna': { const v = d.visits[+el.dataset.i]; const k = el.dataset.k; v.scNa = v.scNa || {};
      if (v.scNa[k]) delete v.scNa[k]; else { v.scNa[k] = true; delete v.sc[k]; } touch(d); renderPage(); renderTabs(); break; }
    case 'note': UI.open[el.dataset.k] = !UI.open[el.dataset.k]; renderPage(); break;
    case 'pick': { const cur = getPath(d, el.dataset.path); setPath(d, el.dataset.path, cur === el.dataset.val ? '' : el.dataset.val); touch(d); renderPage(); renderTabs(); break; }
    case 'step': { const cur = +getPath(d, el.dataset.path) || 0; setPath(d, el.dataset.path, Math.max(0, cur + +el.dataset.d)); touch(d); renderPage(); break; }
    case 'goto': gotoId(el.dataset.id); break;
    case 'dictate': toggleDictation(el.dataset.path, el); break;
    case 'addPhoto': photoTarget = { i: +el.dataset.i, key: el.dataset.key }; (el.dataset.src === 'cam' ? camInput : photoInput).click(); break;
    case 'delPhoto': if (confirm(t('confirmDelPhoto'))) { photoHolder(d, +el.dataset.i).photos[el.dataset.key].splice(+el.dataset.j, 1); touch(d); renderPage(); } break;
    case 'zoom': openModal(`<h3>${t('image')}<button data-act="closeModal">×</button></h3><img src="${el.src}" style="width:100%;border-radius:10px">`); break;
    case 'addTodo': { const k = d.todo.findIndex(x => !x.trim()); if (k < 0) d.todo.push(el.dataset.t); else d.todo[k] = el.dataset.t; touch(d); renderPage(); break; }
    case 'pickSeller': openSellerPicker(); break;
    case 'setSeller': S.seller = el.dataset.n; DRAFT = null; UI.tab = 'day'; closeModal(); saveSoon(); render(); break;
    case 'addPerson': { const nm = (prompt(t('sellerName')) || '').trim(); if (!nm) break; const o = (prompt(t('office')) || '').trim().toUpperCase();
      if (!people().some(p => p.name === nm)) S.extraPeople.push({ name: nm, office: o, role: 'Vendeur' }); S.seller = nm; DRAFT = null; closeModal(); saveSoon(); render(); break; }
    case 'mailSeller': openMailModal(); break;
    case 'mailShare': mailShare(); break;
    case 'mailDl': mailDownloadOpen(); break;
    case 'mailPreview': window.open(MAIL.url, '_blank'); break;
    case 'closeModal': closeModal(); break;
    case 'print': printFiche(); break;
    case 'histSel': UI.histSeller = el.dataset.n; renderPage(); break;
    case 'openDay': { const x = S.days[el.dataset.id]; S.seller = x.seller; S.date = x.date; if (x.evaluator) S.evaluator = x.evaluator; UI.tab = 'recap'; saveSoon(); render(); window.scrollTo(0, 0); break; }
    case 'delDay': { const x = S.days[el.dataset.id]; if (confirm(t('confirmDelDay', { n: x.seller, d: fmtDate(x.date) }))) { S.days[x.id] = { id: x.id, deleted: true, updatedAt: Date.now() }; saveSoon(); render(); } break; }
    case 'export': exportFile(); break;
    case 'import': $('#fileImport').click(); break;
    case 'linkOpen': linkFile(false); break;
    case 'linkNew': linkFile(true); break;
    case 'relink': relinkFile(); break;
    case 'unlink': FILE = null; UI.fileName = ''; UI.fileState = ''; IDB.del('fileHandle'); render(); break;
  }
});
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

</script>
