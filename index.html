<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Éval JV">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<title>KEYENCE · Évaluation Joint Visit</title>
<style>
:root{
--red:#E60012; --red-d:#b3000e; --red-soft:#fdecee;
--ink:#16181d; --mut:#6b7280; --line:#e3e5ea; --bg:#f3f4f7; --card:#fff;
--tb:#1e8e3e; --b:#7cb342; --m:#f29900; --mv:#d93025;
--rad:14px; --sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:inherit}

/* ---- lock */
#lock{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#2a2a2a,#000);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lock .box{background:#fff;border-radius:16px;padding:36px 34px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lock .logo{background:#000;display:inline-block;padding:12px 20px;border-radius:8px;border-bottom:3px solid var(--red)}
#lock .logo img{height:22px;display:block}
#lock h1{font-size:22px;margin:20px 0 6px}
#lock p{color:var(--mut);font-size:14px;margin:0 0 18px}
#lock input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;outline:none}
#lock input:focus{border-color:var(--red)}
#lock button{margin-top:12px;width:100%;padding:13px;background:var(--red);color:#fff;border-radius:10px;font-weight:700;font-size:16px}
#lock .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
#lock .conf{font-size:11.5px;color:var(--mut);margin-top:8px}

/* ---- top bar */
.topbar{position:sticky;top:0;z-index:50;background:#000;color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tb-row{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));border-bottom:3px solid var(--red)}
.kl img{height:18px;display:block}
.app-title{font-weight:700;font-size:16px;line-height:1.15}
.app-title small{display:block;font-weight:400;font-size:11.5px;color:#aaa}
.save-ind{margin-left:auto;font-size:12px;color:#9ca3af;white-space:nowrap}
.save-ind.ok{color:#86efac}.save-ind.warn{color:#fbbf24}
.ctx-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#121316}
.ctx-seller{display:flex;align-items:center;gap:10px;background:#23252b;border-radius:40px;padding:4px 14px 4px 4px;min-height:48px;color:#fff;font-weight:600}
.ctx-seller .av{width:40px;height:40px}
.ctx-seller small{display:block;font-weight:400;color:#9ca3af;font-size:11.5px}
.ctx-field{display:flex;flex-direction:column;gap:2px}
.ctx-field label{font-size:10.5px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em}
.ctx-field input{background:#23252b;border:1px solid #33363d;border-radius:10px;color:#fff;padding:8px 10px;min-height:40px;color-scheme:dark}
.ctx-field input[list]{width:210px}
.ctx-sp{flex:1}
.ctx-btn{background:#23252b;border:1px solid #33363d;border-radius:10px;color:#fff;padding:9px 14px;min-height:44px;font-weight:600;font-size:14px}
.ctx-btn:active{background:#33363d}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;color:var(--ink)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 14px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;min-height:48px;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--mut)}
.tab.add{color:var(--red)}
.tab .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---- layout */
main{max-width:1100px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .num{background:#000;color:#fff;font-size:12px;border-radius:6px;padding:3px 8px}
.card h2 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
@media (max-width:620px){.grid3{grid-template-columns:1fr}}
.hint{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- form */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label{font-size:12px;font-weight:600;color:var(--mut)}
.f input,.f textarea,.f select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%;min-height:44px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--red)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit{position:relative}.unit input{padding-right:42px}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;color:#374151}
.chip.on{background:#000;border-color:#000;color:#fff}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:9px;font-weight:600;min-height:44px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ---- rating grid */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-head h2{margin:0;flex:1}
.score-badge{font-weight:800;font-size:15px;padding:5px 12px;border-radius:20px;color:#fff;white-space:nowrap}
.score-badge.na{background:var(--bg);color:var(--mut);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.crit{border-top:1px solid var(--line);padding:10px 0}
.crit-main{display:flex;align-items:center;gap:12px}
.crit-t{flex:1;font-weight:500;min-width:0}
.rates{display:flex;gap:6px;flex-shrink:0}
.rate{min-width:86px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:#4b5563;padding:0 8px}
.rate[data-v="4"].on{background:var(--tb);border-color:var(--tb);color:#fff}
.rate[data-v="3"].on{background:var(--b);border-color:var(--b);color:#fff}
.rate[data-v="2"].on{background:var(--m);border-color:var(--m);color:#fff}
.rate[data-v="1"].on{background:var(--mv);border-color:var(--mv);color:#fff}
.note-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);font-size:18px;position:relative;flex-shrink:0;background:#fff}
.note-btn.has{border-color:#000}
.note-btn.has::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.crit textarea{margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:56px;resize:vertical;outline:none}
.crit textarea:focus{border-color:var(--red)}
@media (max-width:900px){
  .crit-main{flex-wrap:wrap}
  .crit-t{flex-basis:100%}
  .rates{flex:1}
  .rate{flex:1;min-width:0}
}

/* ---- visits list */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:110px}
.vcard:active{background:var(--bg)}
.vcard .vt{font-weight:700;font-size:15px}
.vcard .vs{font-size:12.5px;color:var(--mut)}
.vcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--red);font-weight:700;font-size:15px}
.type-tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:#374151}
.type-tag.demo{background:#e0ecff;color:#1d4ed8}.type-tag.appli{background:#fdecee;color:var(--red-d)}.type-tag.fu{background:#e7f6ec;color:#15803d}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--bg);border-radius:12px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mut)}

/* ---- notebook */
.nb-meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px}
details.nb{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
details.nb>summary{list-style:none;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
details.nb>summary::-webkit-details-marker{display:none}
details.nb>summary::before{content:"›";font-size:20px;transition:transform .15s;color:var(--mut);width:12px}
details.nb[open]>summary::before{transform:rotate(90deg)}
details.nb>summary .cnt{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--mut)}
details.nb>summary .cnt.full{background:#e7f6ec;color:#15803d}
details.nb .nb-body{padding:4px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.nb-body .wide{grid-column:1/-1}
.bant{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:2px 6px}

/* ---- recap */
.meter{width:100%;border-collapse:collapse}
.meter th{font-size:12px;color:var(--mut);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.meter td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.meter td.n{font-weight:800;font-size:16px;white-space:nowrap;width:80px}
.meter .bar{height:10px}
.lvl{display:inline-block;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.meter textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;min-height:36px;height:36px;resize:vertical;outline:none;font-size:14px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero .av{width:76px;height:76px;font-size:24px}
.hero h1{margin:0;font-size:22px}
.hero .sub{color:var(--mut);font-size:13.5px}
.gauge{margin-left:auto;text-align:center}
.gauge b{font-size:38px;display:block;line-height:1}
.gauge span{font-size:12px;color:var(--mut)}
.radar-wrap{display:flex;justify-content:center}
.radar-wrap svg{max-width:420px;width:100%;height:auto}
.list-sw{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:9px;background:var(--bg)}
.sw .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.sw .sm{color:var(--mut);font-size:12px}
.sw button{margin-left:auto;font-size:12px;font-weight:700;color:var(--red);white-space:nowrap;padding:2px 4px}
.todo{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.todo b{color:var(--red)}
.todo input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
.todo input:focus{border-color:var(--red)}
table.vt{width:100%;border-collapse:collapse;font-size:14px}
table.vt th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:6px;border-bottom:1px solid var(--line)}
table.vt th:first-child,table.vt td:first-child{text-align:left}
table.vt td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.cell{display:inline-block;min-width:44px;padding:3px 6px;border-radius:7px;font-weight:700;font-size:13px}
.tscroll{overflow-x:auto}

/* ---- buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:700;min-height:46px;background:#000;color:#fff;font-size:14.5px}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--mv);border:1.5px solid #f3c1bd}
.btn:active{opacity:.85}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---- history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.hrow .av{width:42px;height:42px}
.hrow .hm{flex:1;min-width:0}
.hrow .hm b{display:block}
.hrow .hm span{font-size:12.5px;color:var(--mut)}
.hrow .gs{font-weight:800;font-size:18px;text-align:right}
.hrow.cur{border-color:#000}

/* ---- avatars / modal / toast */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#3a3d44;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto}
.modal-box{background:#fff;border-radius:16px;width:min(760px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-box h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center}
.modal-box h3 button{margin-left:auto;font-size:26px;width:44px;height:44px;color:var(--mut)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:65vh;overflow:auto}
.pick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1.5px solid var(--line);text-align:left;font-size:13.5px;font-weight:600;min-height:58px}
.pick>span{min-width:0;overflow-wrap:anywhere}
.pick small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.pick.on{border-color:var(--red);background:var(--red-soft)}
.pick-office{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#111;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:300;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---- print (fiche vendeur A4) */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  #root>*:not(#printArea),#lock,#modal,#toast{display:none!important}
  #printArea{display:block}
  #root.hidden{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pf{font-size:11.5px;color:#111}
.pf-head{display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:10px 14px;border-bottom:3px solid var(--red)}
.pf-head img.l{height:15px}
.pf-head .t{font-weight:800;font-size:15px}
.pf-head .t small{display:block;font-weight:400;color:#bbb;font-size:10.5px}
.pf-head .g{margin-left:auto;text-align:right}
.pf-head .g b{font-size:24px;display:block;line-height:1}
.pf-id{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #ddd}
.pf-id .av{width:54px;height:54px}
.pf h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px;border-left:3px solid var(--red);padding-left:7px}
.pf table{width:100%;border-collapse:collapse}
.pf td,.pf th{border-bottom:1px solid #e5e5e5;padding:4px 6px;text-align:left;vertical-align:top}
.pf th{font-size:10px;color:#666}
.pf .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pf .lvl{font-size:10px;padding:2px 8px}
.pf .foot{margin-top:14px;font-size:9.5px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:6px}
.pf ul{margin:0;padding-left:16px}
.pf li{margin-bottom:2px}

</style>
</head>

const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const f1 = n => n == null ? '–' : n.toFixed(1).replace('.', ',');

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function level(n) {
  if (n == null) return null;
  if (n < 7.5) return LEVELS[3]; if (n < 12.5) return LEVELS[2]; if (n < 17.5) return LEVELS[1]; return LEVELS[0];
}

// ---------------------------------------------------------------- crypto + stockage
const b64e = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
let KEY = null; // clé de stockage (sel fixe => identique d'une version de l'app à l'autre)
async function encObj(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const buf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, new TextEncoder().encode(JSON.stringify(obj)));
  return { app: 'keyence-jv-eval', v: 1, iv: b64e(iv), data: b64e(buf) };
}
async function decObj(p) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.iv) }, KEY, b64d(p.data));
  return JSON.parse(new TextDecoder().decode(buf));
}
const IDB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('keyence-jv-eval', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(k) { return new Promise(res => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); }); },
};
async function kvGet(k) { try { return IDB.db ? await IDB.get(k) : JSON.parse(localStorage.getItem('jv-' + k) || 'null'); } catch (e) { return null; } }
async function kvSet(k, v) { if (IDB.db) return IDB.set(k, v); localStorage.setItem('jv-' + k, JSON.stringify(v)); }

// ---------------------------------------------------------------- calculs
function vals(scores, sec) { return sec.items.map(([id]) => scores[id]).filter(v => v > 0); }
function secNote(day, sid) {
  const sec = SEC[sid];
  const v = sec.scope === 'day' ? vals(day.scores, sec) : day.visits.flatMap(x => vals(x.scores, sec));
  const m = mean(v); return m == null ? null : m * 5;
}
function visitSecNote(v, sid) { const m = mean(vals(v.scores, SEC[sid])); return m == null ? null : m * 5; }
function dayGlobal(day) { return mean(SECTIONS.map(s => secNote(day, s.id)).filter(n => n != null)); }
function visitGlobal(v) { return mean(SECTIONS.filter(s => s.scope === 'visit').map(s => visitSecNote(v, s.id)).filter(n => n != null)); }
function nbStats(v, g) {
  const groups = g ? [g] : NB; let tot = 0, ok = 0;
  groups.forEach(gr => gr.f.forEach(f => { if (f[4]) return; tot++; const x = v.nb[f[0]]; if (Array.isArray(x) ? x.length : (x != null && String(x).trim() !== '')) ok++; }));
  return { tot, ok, r: tot ? ok / tot : 0 };
}
function stratSteps(v) {
  const st = v.strat || {}; const list = STRAT.target.map(([id, t]) => ({ id, t, ok: !!st[id] }));
  (st.focus || []).forEach(k => STRAT[k].steps.forEach(([id, t]) => list.push({ id: k + '.' + id, t: `${k.toUpperCase()} · ${t}`, ok: !!(st[k] || {})[id] })));
  return list;
}
function stratRate(v) { const l = stratSteps(v); return l.length ? l.filter(x => x.ok).length / l.length : null; }
function dayStrat(day) { return mean(day.visits.map(stratRate).filter(r => r != null)); }
function dayOutputs(day) { const o = {}; STRAT.outputs.forEach(([k]) => o[k] = day.visits.filter(v => (v.strat.out || {})[k]).length); return o; }
function critStats(day) {
  const acc = {};
  const add = (id, v) => { if (!(v > 0)) return; (acc[id] = acc[id] || []).push(v); };
  Object.entries(day.scores).forEach(([id, v]) => add(id, v));
  day.visits.forEach(x => Object.entries(x.scores).forEach(([id, v]) => add(id, v)));
  return Object.entries(acc).filter(([id]) => CRIT[id]).map(([id, a]) => ({ id, t: CRIT[id].t, sec: SEC[CRIT[id].sec].t, m: mean(a), n: a.length }));
}

// ---------------------------------------------------------------- sauvegarde
let saveT = null;
function saveSoon() { setInd('Enregistrement…', ''); clearTimeout(saveT); saveT = setTimeout(doSave, 500); }
async function doSave() {
  try {
    await kvSet('state', await encObj(S));
    let msg = 'Enregistré ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    if (FILE && UI.fileState === 'ok') {
      try { await syncFile(); msg += ' · fichier ✓'; } catch (e) { UI.fileState = 'err'; msg += ' · fichier ✗'; console.error(e); }
    }
    setInd(msg, 'ok');
  } catch (e) { console.error(e); setInd('⚠ Erreur de sauvegarde', 'warn'); toast('Erreur de sauvegarde : ' + e.message); }
}
function setInd(t, c) { const e = $('#saveInd'); if (e) { e.textContent = t; e.className = 'save-ind ' + c; } }
function mergeIn(other) {
  let n = 0;
  Object.values(other.days || {}).forEach(d => {
    const cur = S.days[d.id];
    if (!cur || (d.updatedAt || 0) > (cur.updatedAt || 0)) { S.days[d.id] = d; n++; }
  });
  (other.extraPeople || []).forEach(p => { if (!S.extraPeople.some(x => x.name === p.name)) S.extraPeople.push(p); });
  return n;
}
async function readFileObj(h) {
  const f = await h.getFile(); const txt = await f.text();
  if (!txt.trim()) return null;
  const p = JSON.parse(txt); if (p.app !== 'keyence-jv-eval') throw new Error('Ce fichier n’est pas une sauvegarde JV');
  return decObj(p);
}
async function syncFile() {
  const other = await readFileObj(FILE);
  const n = other ? mergeIn(other) : 0;
  const w = await FILE.createWritable(); await w.write(JSON.stringify(await encObj(S))); await w.close();
  if (n) { await kvSet('state', await encObj(S)); if (!document.activeElement || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); }
  return n;
}
async function linkFile(create) {
  try {
    const opts = { types: [{ description: 'Sauvegarde Évaluations JV (chiffrée)', accept: { 'application/json': ['.json'] } }] };
    const h = create ? await window.showSaveFilePicker({ ...opts, suggestedName: 'Evaluations_JV_APP.jvdata.json' })
      : (await window.showOpenFilePicker(opts))[0];
    if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permission refusée');
    FILE = h; UI.fileName = h.name; UI.fileState = 'ok';
    await IDB.set('fileHandle', h);
    const n = await syncFile();
    toast(`Fichier lié : ${h.name}` + (n ? ` · ${n} journée(s) récupérée(s)` : ''));
    render();
  } catch (e) { if (e.name !== 'AbortError') toast('Liaison impossible : ' + e.message); }
}
async function relinkFile() {
  try {
    if ((await FILE.requestPermission({ mode: 'readwrite' })) !== 'granted') return;
    UI.fileState = 'ok'; const n = await syncFile(); toast('Fichier reconnecté' + (n ? ` · ${n} journée(s) mise(s) à jour` : '')); render();
  } catch (e) { UI.fileState = 'err'; toast('Reconnexion impossible : ' + e.message); render(); }
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function exportFile() {
  const name = `Evaluations_JV_APP_${today()}.jvdata.json`;
  const blob = new Blob([JSON.stringify(await encObj(S))], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Sauvegarde exportée (chiffrée)');
}
async function importFile(file) {
  try {
    const p = JSON.parse(await file.text());
    if (p.app !== 'keyence-jv-eval') throw new Error('fichier non reconnu');
    const n = mergeIn(await decObj(p)); touchSaveOnly(); toast(`Import terminé : ${n} journée(s) ajoutée(s) / mise(s) à jour`); render();
  } catch (e) { toast('Import impossible : ' + (e.name === 'OperationError' ? 'mot de passe différent' : e.message)); }

// ---------------------------------------------------------------- déverrouillage
async function unlock() {
  const pw = $('#pw').value; const err = $('#err'); err.textContent = '';
  if (!pw) return;
  $('#go').disabled = true; $('#go').textContent = 'Ouverture…';
  try {
    const p = JSON.parse($('#payload').textContent);
    const k = await deriveKey(pw, b64d(p.salt), p.iter);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.iv) }, k, b64d(p.data));
    DATA = JSON.parse(new TextDecoder().decode(buf));
  } catch (e) {
    err.textContent = window.crypto && crypto.subtle ? 'Mot de passe incorrect.' : 'Navigateur non compatible (ouvrir dans Safari / Edge).';
    $('#go').disabled = false; $('#go').textContent = 'Entrer'; return;
  }
  KEY = await deriveKey(pw, new TextEncoder().encode('keyence-jv-eval-store-v1'), 250000);
  try { await IDB.open(); } catch (e) { console.warn('IndexedDB indisponible', e); }
  const st = await kvGet('state');
  if (st) { try { S = Object.assign(S, await decObj(st)); } catch (e) { toast('Données locales illisibles (autre mot de passe ?)'); } }
  if (!S.evaluator) S.evaluator = 'Kenddy SOURIAU';
  S.date = S.date || today();
  if (IDB.db && window.showSaveFilePicker) {
    try {
      const h = await IDB.get('fileHandle');
      if (h) { FILE = h; UI.fileName = h.name; UI.fileState = (await h.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'relink'; if (UI.fileState === 'ok') syncFile().catch(() => { UI.fileState = 'err'; render(); }); }
    } catch (e) { console.warn(e); }
  }
  $('#lock').remove(); $('#root').classList.remove('hidden');
  if (!S.seller) { UI.tab = 'day'; }
  render();
  if (!S.seller) openSellerPicker();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
$('#go').onclick = unlock;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function nbField(P, v, [id, t, type, o, sub]) {
  const val = v.nb[id]; const path = `${P}nb.${id}`;
  const wide = type === 'a' ? ' wide' : '';
  let inner;
  if (type === 'c') inner = `<div class="chips">${o.map(x => chip(path, x, val === x)).join('')}</div>`;
  else if (type === 'm') inner = `<div class="chips">${o.map(x => mchip(path, x, (val || []).includes(x))).join('')}</div>`;
  else if (type === 'a') inner = `<textarea data-bind="${path}">${esc(val)}</textarea>`;
  else if (type === 'd') inner = `<input type="date" data-bind="${path}" value="${esc(val)}">`;
  else if (type === 'n') inner = o ? `<div class="unit"><input inputmode="decimal" data-bind="${path}" value="${esc(val)}"><span>${o}</span></div>` : `<input inputmode="decimal" data-bind="${path}" value="${esc(val)}">`;
  else inner = `<input data-bind="${path}" value="${esc(val)}">`;
  return `<div class="f${wide}"><label>${esc(t)}${sub ? ' <span style="font-weight:400">(option.)</span>' : ''}</label>${inner}</div>`;
}

function radar(vals, labels, size = 420) {
  const cx = size / 2, cy = size / 2 + 4, R = size / 2 - 70, n = vals.length;
  const pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / n), cy - r * Math.cos(2 * Math.PI * i / n)];
  let s = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  [5, 10, 15, 20].forEach(k => { s += `<polygon points="${labels.map((_, i) => pt(i, R * k / 20).join(',')).join(' ')}" fill="${k === 20 ? '#fafafa' : 'none'}" stroke="#e3e5ea"/>`; s += `<text x="${cx + 3}" y="${cy - R * k / 20 + 11}" font-size="10" fill="#9ca3af">${k}</text>`; });
  labels.forEach((l, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3e5ea"/>`; const [tx, ty] = pt(i, R + 30); const nv = vals[i]; const lv = level(nv);
    s += `<text x="${tx}" y="${ty}" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">${esc(l)}</text><text x="${tx}" y="${ty + 15}" text-anchor="middle" font-size="12" font-weight="700" fill="${lv ? lv.c : '#9ca3af'}">${nv == null ? '–' : f1(nv)}</text>`; });
  const poly = vals.map((v, i) => pt(i, R * (v || 0) / 20).join(',')).join(' ');
  s += `<polygon points="${poly}" fill="rgba(230,0,18,.18)" stroke="#E60012" stroke-width="2.5"/>`;
  vals.forEach((v, i) => { if (v != null) { const [x, y] = pt(i, R * v / 20); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#E60012"/>`; } });
  return s + '</svg>';
}

function lineChart(days) {
  const W = 760, H = 240, L = 34, Rr = 14, T = 14, B = 34; const n = days.length;
  const x = i => n === 1 ? (L + W - Rr) / 2 : L + i * (W - L - Rr) / (n - 1); const y = v => T + (20 - v) * (H - T - B) / 20;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  [[0, 7.5, '#d93025'], [7.5, 12.5, '#f29900'], [12.5, 17.5, '#7cb342'], [17.5, 20, '#1e8e3e']].forEach(([a, b, c]) => s += `<rect x="${L}" y="${y(b)}" width="${W - L - Rr}" height="${y(a) - y(b)}" fill="${c}" opacity=".07"/>`);
  [0, 5, 10, 15, 20].forEach(v => s += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e5ea"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#9ca3af">${v}</text>`);
  const pts = days.map((d, i) => [x(i), dayGlobal(d)]).filter(p => p[1] != null);
  if (pts.length > 1) s += `<polyline points="${pts.map(p => p[0] + ',' + y(p[1])).join(' ')}" fill="none" stroke="#E60012" stroke-width="2.5"/>`;
  days.forEach((d, i) => { const g = dayGlobal(d); s += `<text x="${x(i)}" y="${H - 12}" font-size="11" text-anchor="middle" fill="#6b7280">${fmtDate(d.date).slice(0, 5)}</text>`;
    if (g != null) s += `<circle cx="${x(i)}" cy="${y(g)}" r="5" fill="${level(g).c}" stroke="#fff" stroke-width="2"/><text x="${x(i)}" y="${y(g) - 10}" font-size="11.5" font-weight="700" text-anchor="middle">${f1(g)}</text>`; });
  return s + '</svg>';
}

    <p class="hint">${isIOS() ? 'Sur iPad : « Exporter » ouvre le menu de partage → <b>Enregistrer dans Fichiers</b> → OneDrive. « Importer » permet de récupérer le fichier mis à jour depuis le PC.' : 'Le fichier exporté est chiffré avec le mot de passe de l’application.'}</p>
    <div class="actions"><button class="btn red" data-act="export">📤 Exporter la sauvegarde</button><button class="btn" data-act="import">📥 Importer / fusionner</button></div></div>
  <div class="card"><h2>👤 Vendeurs</h2><p class="hint">${people().length} personnes disponibles. Tu peux ajouter un vendeur absent de la liste depuis le sélecteur de vendeur.</p></div>`;
}

// ---------------------------------------------------------------- impression fiche vendeur
function printFiche() {
  const d = curDay(); if (!d) return;
  const notes = SECTIONS.map(s => secNote(d, s.id)); const g = dayGlobal(d); const out = dayOutputs(d);
  const cs = critStats(d); const strong = cs.filter(c => c.m >= 3.5).sort((a, b) => b.m - a.m).slice(0, 6);
  const todo = d.todo.filter(t => t.trim());
  const logo = document.querySelector('.kl img').src;
  $('#printArea').innerHTML = `<div class="pf">
    <div class="pf-head"><img class="l" src="${logo}"><div class="t">Évaluation journée de Joint Visit<small>Line APP · Sales Skill Meter</small></div>
      <div class="g"><b>${f1(g)}<span style="font-size:12px"> / 20</span></b>${lvlTag(g)}</div></div>
    <div class="pf-id">${avatar(d.seller)}<div><b style="font-size:15px">${esc(d.seller)}</b><br>${esc(fmtDateL(d.date))} · ${esc(officeOf(d.seller))} · évaluateur : ${esc(d.evaluator)}<br>
      ${d.visits.length} visite(s) : ${VTYPES.map(([k, t]) => `${d.visits.filter(v => v.type === k).length} ${t}`).join(' · ')}</div>
      <div style="margin-left:auto;width:190px">${radar(notes, SECTIONS.map(s => s.t), 300)}</div></div>
    <h4>Sales Skill Meter</h4><table><tr><th>Section</th><th>Note /20</th><th>Niveau</th><th>Commentaire</th></tr>
      ${SECTIONS.map((s, k) => `<tr><td><b>${esc(s.t)}</b></td><td><b>${f1(notes[k])}</b></td><td>${lvlTag(notes[k])}</td><td>${esc(d.secCom[s.id] || '')}</td></tr>`).join('')}
      <tr><td><b>Note globale</b></td><td><b>${f1(g)}</b></td><td>${lvlTag(g)}</td><td></td></tr></table>
    <h4>Stratégie de l'année</h4><table><tr><th>Target Company</th><th>Contacts clés</th><th>ECO enreg.</th>${STRAT.outputs.map(o => `<th>${o[1]}</th>`).join('')}<th>Respect</th></tr>
      <tr><td>${d.visits.filter(v => v.strat.tc).length} / ${d.visits.length}</td><td>${d.visits.filter(v => v.strat.kc).length}</td><td>${d.visits.filter(v => v.strat.ecoRec).length}</td>${STRAT.outputs.map(([k]) => `<td><b>${out[k]}</b></td>`).join('')}<td>${pct(dayStrat(d))}</td></tr></table>
    <h4>Détail des visites</h4><table><tr><th>#</th><th>Société</th><th>Type</th><th>Solution</th><th>Opening</th><th>Probing</th><th>Supporting</th><th>Closing</th><th>Note</th><th>Outputs</th></tr>
      ${d.visits.map((v, i) => `<tr><td>${i + 1}</td><td>${esc(v.company)}</td><td>${VT[v.type]}</td><td>${(v.strat.focus || []).map(f => f.toUpperCase()).join(' + ')}</td>${['open', 'prob', 'supp', 'clos'].map(s => `<td>${f1(visitSecNote(v, s))}</td>`).join('')}<td><b>${f1(visitGlobal(v))}</b></td><td>${STRAT.outputs.filter(([k]) => v.strat.out[k]).map(o => o[1]).join(', ')}</td></tr>`).join('')}</table>
    <div class="two"><div><h4>Points forts</h4><ul>${strong.map(c => `<li>${esc(c.t)}</li>`).join('')}</ul>${d.strengths ? `<p>${esc(d.strengths)}</p>` : ''}</div>
      <div><h4>À travailler pour la prochaine fois</h4><ul>${todo.map(t => `<li>※ ${esc(t)}</li>`).join('') || '<li>–</li>'}</ul></div></div>
    ${d.synthesis ? `<h4>Synthèse</h4><p style="white-space:pre-wrap">${esc(d.synthesis)}</p>` : ''}
    <div class="foot">Confidentiel – usage interne KEYENCE France · document généré le ${new Date().toLocaleDateString('fr-FR')}</div></div>`;
  setTimeout(() => window.print(), 150);
}

// ---------------------------------------------------------------- modales
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function openSellerPicker(q = '') {
  const nq = q.toLowerCase();
  const list = people().filter(p => !nq || p.name.toLowerCase().includes(nq) || (p.office || '').toLowerCase().includes(nq));
  const offices = [...new Set(list.map(p => p.office || '—'))];
  openModal(`<h3>Choisir le vendeur<button data-act="closeModal">×</button></h3>
    <div class="row" style="margin-bottom:12px"><div class="f" style="flex:1"><input id="pickQ" placeholder="Rechercher…" value="${esc(q)}"></div><button class="btn ghost" data-act="addPerson">＋ Nouveau vendeur</button></div>
    <div class="pick-grid">${offices.map(o => `<div class="pick-office">${esc(o)}</div>` + list.filter(p => (p.office || '—') === o).map(p =>
      `<button class="pick ${p.name === S.seller ? 'on' : ''}" data-act="setSeller" data-n="${esc(p.name)}">${avatar(p.name)}<span>${esc(p.name)}<small>${esc(p.role || '')}</small></span></button>`).join('')).join('')}</div>`);
  const qi = $('#pickQ'); qi.addEventListener('input', () => { const pos = qi.selectionStart; openSellerPicker(qi.value); const n = $('#pickQ'); n.focus(); n.setSelectionRange(pos, pos); });
}

// ---------------------------------------------------------------- photos
let photoTarget = null;
const photoInput = document.createElement('input'); photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.multiple = true; photoInput.className = 'hidden'; document.body.appendChild(photoInput);
photoInput.addEventListener('change', async () => {
  const files = [...photoInput.files]; photoInput.value = ''; if (!files.length || !photoTarget) return;
  const d = curDay(); const v = d.visits[photoTarget.i]; if (!v) return;
  for (const f of files) {
    try { (v.photos[photoTarget.key] = v.photos[photoTarget.key] || []).push(await compress(f)); } catch (e) { toast('Image illisible'); }
  }
  const flowStep = [...STRAT.iv.photos.map(p => ['iv', ...p]), ...STRAT.sj.photos.map(p => ['sj', ...p])].find(p => p[1] === photoTarget.key);
  if (flowStep) { v.strat[flowStep[0]] = v.strat[flowStep[0]] || {}; v.strat[flowStep[0]][flowStep[3]] = true; }
  touch(d); render();
});
function compress(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

// ---------------------------------------------------------------- liaison des champs
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], obj); }
function refreshNbCounters(i) {
  const v = curDay().visits[i]; if (!v) return; const s = nbStats(v);
  const a = $('#nbAll'); if (a) { a.textContent = `${s.ok} / ${s.tot} champs`; $('#nbBar').style.width = Math.round(s.r * 100) + '%'; $('#nbPct').textContent = pct(s.r); }
  NB.forEach(g => { const e = document.querySelector(`[data-cnt="${g.id}"]`); if (e) { const x = nbStats(v, g); e.textContent = `${x.ok} / ${x.tot}`; e.classList.toggle('full', x.ok === x.tot); } });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ctxEval') { S.evaluator = t.value; const d = curDay(); if (d) { d.evaluator = t.value; if (S.days[d.id]) touch(d); else saveSoon(); } else saveSoon(); return; }
  const b = t.dataset && t.dataset.bind; if (!b) return;
  const d = curDay(); if (!d) return;
  setPath(d, b, t.value); touch(d);
  const m = b.match(/^visits\.(\d+)\.nb\./); if (m) refreshNbCounters(+m[1]);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctxDate') { if (t.value) { S.date = t.value; DRAFT = null; UI.tab = 'day'; saveSoon(); render(); } return; }
  if (t.id === 'histSel') { UI.histSeller = t.value; renderPage(); return; }
  if (t.id === 'fileImport') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }
});
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) UI.open[k] = e.target.open; }, true);

// ---------------------------------------------------------------- actions
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; const d = curDay();
  switch (a) {
    case 'tab': UI.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'openVisit': UI.tab = 'visit'; UI.vi = +el.dataset.i; render(); window.scrollTo(0, 0); break;
    case 'addVisit': d.visits.push(blankVisit(d.visits.length + 1)); touch(d); UI.tab = 'visit'; UI.vi = d.visits.length - 1; render(); window.scrollTo(0, 0); break;
    case 'delVisit': if (confirm(`Supprimer la visite ${+el.dataset.i + 1}${d.visits[el.dataset.i].company ? ' (' + d.visits[el.dataset.i].company + ')' : ''} ?`)) { d.visits.splice(+el.dataset.i, 1); touch(d); UI.tab = 'day'; render(); } break;
    case 'rate': { const holder = el.dataset.base ? getPath(d, el.dataset.base.slice(0, -1)) : d; const id = el.dataset.id; const v = +el.dataset.v;
      if (holder.scores[id] === v) delete holder.scores[id]; else holder.scores[id] = v; touch(d); renderPage(); renderTabs(); break; }
    case 'note': UI.open[el.dataset.k] = !UI.open[el.dataset.k]; renderPage(); { const ta = el.closest('.crit') && document.querySelector(`[data-k="${el.dataset.k}"]`).closest('.crit').querySelector('textarea'); if (ta) ta.focus(); } break;
    case 'chip': { const cur = getPath(d, el.dataset.path); setPath(d, el.dataset.path, cur === el.dataset.val && !/.type$/.test(el.dataset.path) ? '' : el.dataset.val); touch(d); renderPage(); renderTabs(); break; }
    case 'mchip': { const cur = getPath(d, el.dataset.path) || []; const v = el.dataset.val; setPath(d, el.dataset.path, cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]); touch(d); renderPage(); renderTabs(); break; }
    case 'tog': setPath(d, el.dataset.path, !getPath(d, el.dataset.path)); touch(d); renderPage(); renderTabs(); break;
    case 'addPhoto': photoTarget = { i: +el.dataset.i, key: el.dataset.key }; photoInput.click(); break;
    case 'delPhoto': if (confirm('Supprimer cette image ?')) { d.visits[+el.dataset.i].photos[el.dataset.key].splice(+el.dataset.j, 1); touch(d); renderPage(); } break;
    case 'zoom': openModal(`<h3>Image<button data-act="closeModal">×</button></h3><img src="${el.src}" style="width:100%;border-radius:10px">`); break;
    case 'addTodo': { const k = d.todo.findIndex(t => !t.trim()); if (k < 0) d.todo.push(el.dataset.t); else d.todo[k] = el.dataset.t; touch(d); renderPage(); break; }
    case 'pickSeller': openSellerPicker(); break;
    case 'setSeller': S.seller = el.dataset.n; DRAFT = null; UI.tab = 'day'; closeModal(); saveSoon(); render(); break;
    case 'addPerson': { const n = (prompt('Prénom NOM du vendeur :') || '').trim(); if (!n) break; const o = (prompt('Agence (ex. LYNO) :') || '').trim().toUpperCase();
      if (!people().some(p => p.name === n)) S.extraPeople.push({ name: n, office: o, role: 'Vendeur' }); S.seller = n; DRAFT = null; closeModal(); saveSoon(); render(); break; }
    case 'closeModal': closeModal(); break;
    case 'print': printFiche(); break;
    case 'histSel': UI.histSeller = el.dataset.n; renderPage(); break;
    case 'openDay': { const x = S.days[el.dataset.id]; S.seller = x.seller; S.date = x.date; if (x.evaluator) S.evaluator = x.evaluator; UI.tab = 'recap'; saveSoon(); render(); window.scrollTo(0, 0); break; }
    case 'delDay': { const x = S.days[el.dataset.id]; if (confirm(`Supprimer définitivement l'évaluation de ${x.seller} du ${fmtDate(x.date)} ?`)) { S.days[x.id] = { id: x.id, deleted: true, updatedAt: Date.now() }; saveSoon(); render(); } break; }
    case 'export': exportFile(); break;
    case 'import': $('#fileImport').click(); break;
    case 'linkOpen': linkFile(false); break;
    case 'linkNew': linkFile(true); break;
    case 'relink': relinkFile(); break;
    case 'unlink': FILE = null; UI.fileName = ''; UI.fileState = ''; IDB.del('fileHandle'); render(); break;
  }
});
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

</script>
